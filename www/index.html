<!DOCTYPE html>
<html lang="en" class="dark" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURORA DIARY</title>

    <!-- PWA & Theme Integration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --page-bg: #000000;
            --page-fg: #f1f5f9;
            --panel-bg: #121215;
            --panel-alt: #18181b;
            --bar-bg: rgba(0, 0, 0, 0.95);
            --bar-border: #27272a;
            --muted-fg: #94a3b8;
            --book-cover: #0c0c0e;
            --book-spine: #18181b;
        }
        [data-theme="dark"] {
            --page-bg: #0f172a;
            --page-fg: #f1f5f9;
            --panel-bg: #1e293b;
            --panel-alt: #0f172a;
            --bar-bg: rgba(15, 23, 42, 0.95);
            --bar-border: #334155;
            --muted-fg: #94a3b8;
            --book-cover: #172033;
            --book-spine: #0f172a;
        }
        [data-theme="light"] {
            --page-bg: #f1f5f9;
            --page-fg: #1e293b;
            --panel-bg: #ffffff;
            --panel-alt: #f8fafc;
            --bar-bg: rgba(255, 255, 255, 0.95);
            --bar-border: #cbd5e1;
            --muted-fg: #64748b;
            --book-cover: #e2e8f0;
            --book-spine: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--page-bg);
            color: var(--page-fg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s, color 0.25s;
            overflow-x: hidden;
        }
        .hidden { display: none !important; }
        button, input, textarea, select { font-family: inherit; color: inherit; }
        button { cursor: pointer; border: none; background: none; }
        button:active { transform: scale(0.97); }

        /* FANCY BOOK LOCK SCREEN */
        #lockScreen {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at center, var(--panel-bg) 0%, var(--page-bg) 100%);
            display: flex; align-items: center; justify-content: center; padding: 1.25rem;
        }
        .book-cover {
            width: 100%; max-width: 380px; min-height: 540px;
            background: linear-gradient(135deg, var(--book-cover) 0%, var(--panel-bg) 100%);
            border: 2px solid var(--bar-border);
            border-left: 14px solid var(--book-spine);
            border-radius: 8px 24px 24px 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.06);
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 2.2rem 1.5rem;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s;
        }
        .book-cover.opening {
            transform: perspective(1000px) rotateY(-85deg) scale(1.05);
            opacity: 0;
        }
        .book-frame {
            position: absolute; inset: 12px;
            border: 1px solid var(--accent-color);
            opacity: 0.35; border-radius: 4px 16px 16px 4px;
            pointer-events: none;
        }
        .emblem-wrap {
            width: 130px; height: 130px; border-radius: 50%;
            padding: 4px; background: linear-gradient(135deg, var(--accent-color), transparent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .emblem-wrap:hover { transform: scale(1.04); box-shadow: 0 12px 35px var(--accent-glow); }
        .emblem-wrap img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
            background: var(--page-bg);
        }
        .book-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.75rem; font-weight: 700; letter-spacing: 0.14em;
            text-align: center; color: var(--accent-color);
            text-shadow: 0 2px 12px var(--accent-glow);
        }

        /* CUSTOM PIN KEYPAD */
        .pin-dots { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
        .pin-dot {
            width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid var(--accent-color);
            transition: background-color 0.15s, transform 0.15s;
        }
        .pin-dot.filled { background-color: var(--accent-color); transform: scale(1.15); }
        .keypad-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 100%; max-width: 260px; margin: 0 auto;
        }
        .key-btn {
            height: 50px; border-radius: 14px;
            background: var(--panel-alt); border: 1px solid var(--bar-border);
            font-size: 1.2rem; font-weight: 700; color: var(--page-fg);
            display: flex; align-items: center; justify-content: center;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .key-btn:hover { border-color: var(--accent-color); }

        /* HEADER & LAYOUT */
        header {
            position: sticky; top: 0; z-index: 30;
            background: var(--bar-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--bar-border);
            padding: 0.75rem 1rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--page-fg); background: var(--panel-bg);
            border: 1px solid var(--bar-border);
        }
        .icon-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
        main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 1rem; }

        /* PAGE 1: BOOK CHAPTER CARDS */
        .chapter-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem; margin-top: 0.5rem;
        }
        .chapter-card {
            background: var(--panel-bg); border: 1px solid var(--bar-border);
            border-radius: 22px; padding: 1.35rem;
            display: flex; align-items: center; gap: 1rem; text-align: left;
            position: relative; overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        .chapter-card:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .chapter-icon {
            width: 52px; height: 52px; border-radius: 16px; flex-shrink: 0;
            background: var(--panel-alt); border: 1px solid var(--bar-border);
            color: var(--accent-color);
            display: flex; align-items: center; justify-content: center;
        }

        /* TOOLBARS, FOLDERS & ENTRIES */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
            justify-content: space-between; margin-bottom: 1rem;
            background: var(--panel-bg); padding: 0.65rem;
            border-radius: 16px; border: 1px solid var(--bar-border);
        }
        .btn-pill {
            padding: 0.45rem 0.85rem; border-radius: 11px; font-size: 0.78rem; font-weight: 600;
            background: var(--panel-alt); border: 1px solid var(--bar-border);
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn-pill.primary { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .btn-pill.danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .folder-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 0.75rem; margin-bottom: 1.25rem;
        }
        .folder-card {
            background: var(--panel-bg); border: 1px solid var(--bar-border);
            border-radius: 18px; padding: 0.9rem;
            display: flex; flex-direction: column; gap: 0.5rem;
            position: relative;
        }
        .entry-row {
            background: var(--panel-bg); border: 1px solid var(--bar-border);
            border-radius: 16px; padding: 0.85rem 1rem; margin-bottom: 0.6rem;
            display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        }
        .entry-row input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--accent-color); flex-shrink: 0;
        }

        /* BUCKET LIST */
        .bucket-item {
            background: var(--panel-bg); border: 1px solid var(--bar-border);
            border-radius: 16px; padding: 0.9rem 1rem; margin-bottom: 0.6rem;
            display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
            transition: opacity 0.3s;
        }
        .bucket-item.completed { opacity: 0.45; }
        .bucket-item.completed .bucket-text { text-decoration: line-through; }

        /* FORMS & MODALS */
        .modal-backdrop {
            position: fixed; inset: 0; z-index: 60;
            background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-card {
            background: var(--panel-bg); border: 1px solid var(--bar-border);
            border-radius: 24px; padding: 1.4rem; width: 100%; max-width: 460px;
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .field-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted-fg); margin-bottom: 0.35rem; }
        .text-input, .text-area, .select-input {
            width: 100%; background: var(--panel-alt); border: 1px solid var(--bar-border);
            border-radius: 12px; padding: 0.65rem 0.85rem; font-size: 0.9rem; color: var(--page-fg);
            outline: none;
        }
        .text-input:focus, .text-area:focus, .select-input:focus { border-color: var(--accent-color); }
        .text-area { min-height: 120px; resize: vertical; line-height: 1.5; }

        /* TOAST */
        #toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 120; background: var(--panel-bg); color: var(--page-fg);
            border: 1px solid var(--accent-color); padding: 0.6rem 1.1rem;
            border-radius: 14px; font-size: 0.8rem; font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

    <!-- ==========================================
         1. FANCY BOOK LOCK SCREEN (EMBLEM TAP TRIGGER)
         ========================================== -->
    <div id="lockScreen">
        <div id="bookCover" class="book-cover">
            <div class="book-frame"></div>

            <!-- Top Emblem & Title (Clickable Emblem to Open PIN Pad) -->
            <div style="text-align: center; z-index: 2; width: 100%;">
                <button id="emblemUnlockBtn" class="emblem-wrap" style="margin: 0 auto 0.75rem auto;" title="Tap to unlock">
                    <img src="icon.png" alt="Aurora Diary Emblem" onerror="this.style.display='none'">
                </button>
                <h1 class="book-title">AURORA DIARY</h1>
                <p id="lockSubtitle" style="font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted-fg); margin-top: 0.35rem;">
                    Tap emblem to unlock
                </p>
            </div>

            <!-- PIN Pad Area (Hidden until emblem is tapped) -->
            <div id="pinPadContainer" class="hidden" style="width: 100%; z-index: 6; text-align: center;">
                <p id="pinPromptLabel" style="font-size: 0.8rem; font-weight: 700; color: var(--accent-color);">Enter PIN</p>
                <div id="pinDots" class="pin-dots">
                    <span class="pin-dot"></span><span class="pin-dot"></span>
                    <span class="pin-dot"></span><span class="pin-dot"></span>
                </div>
                <div id="customKeypad" class="keypad-grid"></div>
            </div>

            <!-- Bottom Signature -->
            <div id="lockFooterHint" style="text-align: center; z-index: 2;">
                <p style="font-size: 0.62rem; font-family: monospace; letter-spacing: 0.16em; color: var(--muted-fg); opacity: 0.6;">MADE BY REAPER-357</p>
            </div>
        </div>
    </div>

    <!-- ==========================================
         2. MAIN APP SHELL (UNLOCKED BOOK)
         ========================================== -->
    <div id="appShell" class="hidden" style="min-height: 100vh; display: flex; flex-direction: column;">
        <header>
            <div style="display: flex; align-items: center; gap: 0.65rem;">
                <button id="homeBtn" class="icon-btn hidden" title="Back to Book Index">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <img src="small-icon.png" alt="Logo" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--bar-border);" onerror="this.style.display='none'">
                <div>
                    <h2 id="headerTitle" style="font-size: 0.98rem; font-weight: 800; letter-spacing: 0.04em; color: var(--accent-color);">AURORA DIARY</h2>
                    <p id="headerSubtitle" style="font-size: 0.68rem; color: var(--muted-fg);">Page 1 &bull; Table of Contents</p>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.45rem;">
                <button id="openSearchBtn" class="icon-btn" title="Search Everything">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <button id="lockNowBtn" class="icon-btn" title="Close & Lock Book">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </button>
                <button id="openSettingsBtn" class="icon-btn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </header>

        <main id="mainView"></main>

        <footer style="padding: 1.25rem; text-align: center;">
            <p style="font-size: 0.65rem; font-family: monospace; letter-spacing: 0.16em; color: var(--muted-fg); opacity: 0.6;">
                MADE BY REAPER-357 &bull; 100% OFFLINE &amp; ENCRYPTED
            </p>
        </footer>
    </div>

    <!-- ==========================================
         3. MODALS (ENTRY, FOLDER, SEARCH, SETTINGS, CONFIRM)
         ========================================== -->
    <div id="modalRoot" class="modal-backdrop hidden"></div>
    <div id="toast" class="hidden"></div>

    <script>
        /* =========================================================
           WEB CRYPTO AES-GCM ENCRYPTION ENGINE (100% OFFLINE)
           ========================================================= */
        const STORAGE_VAULT_KEY = 'aurora_diary_encrypted_vault_v1';
        const STORAGE_SALT_KEY = 'aurora_diary_salt_v1';
        const STORAGE_HAS_PIN = 'aurora_diary_has_pin_v1';

        let activeCryptoKey = null;
        let currentPinBuffer = '';
        let pinSetupFirstEntry = null;

        const defaultAppData = () => ({
            dreams: { folders: [], entries: [] },
            diary: { folders: [], entries: [] },
            bucketList: [],
            bucketInitialized: false,
            avatar: {
                image: '',
                nickname: '',
                whoAmI: '',
                whoIWantToBe: '',
                whatMakesMeHappy: '',
                favouriteThings: ''
            }
        });

        let appData = defaultAppData();

        function bufToB64(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)));
        }
        function b64ToBuf(b64) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }

        async function deriveKeyFromPin(pin, saltBytes) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: saltBytes, iterations: 120000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptPayload(obj, key) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(JSON.stringify(obj));
            const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
            return JSON.stringify({ iv: bufToB64(iv), data: bufToB64(cipher) });
        }

        async function decryptPayload(cipherJsonStr, key) {
            const parsed = JSON.parse(cipherJsonStr);
            const iv = b64ToBuf(parsed.iv);
            const data = b64ToBuf(parsed.data);
            const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
            return JSON.parse(new TextDecoder().decode(plain));
        }

        async function saveVault() {
            if (!activeCryptoKey) return;
            const encryptedStr = await encryptPayload(appData, activeCryptoKey);
            localStorage.setItem(STORAGE_VAULT_KEY, encryptedStr);
        }

        /* =========================================================
           THEME & ACCENT PERSISTENCE
           ========================================================= */
        function setAccentColor(hex) {
            localStorage.setItem('ad_accent', hex);
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--accent-glow', hex + '40');
        }
        function setAppTheme(theme) {
            if (!['black', 'dark', 'light'].includes(theme)) theme = 'black';
            localStorage.setItem('ad_theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.classList.toggle('dark', theme !== 'light');
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', { black: '#000000', dark: '#0f172a', light: '#f1f5f9' }[theme]);
        }

        /* =========================================================
           LOCK SCREEN & CUSTOM KEYPAD LOGIC (EMBLEM TRIGGER)
           ========================================================= */
        const emblemUnlockBtn = document.getElementById('emblemUnlockBtn');
        const pinPadContainer = document.getElementById('pinPadContainer');
        const lockSubtitle = document.getElementById('lockSubtitle');
        const lockFooterHint = document.getElementById('lockFooterHint');
        const pinPromptLabel = document.getElementById('pinPromptLabel');

        emblemUnlockBtn.addEventListener('click', () => {
            emblemUnlockBtn.style.pointerEvents = 'none';
            lockSubtitle.classList.add('hidden');
            lockFooterHint.classList.add('hidden');
            pinPadContainer.classList.remove('hidden');
            currentPinBuffer = '';
            pinSetupFirstEntry = null;
            const hasPin = localStorage.getItem(STORAGE_HAS_PIN) === '1';
            pinPromptLabel.textContent = hasPin ? 'Enter 4-Digit PIN' : 'Create New 4-Digit PIN';
            renderPinDots();
            buildKeypad();
        });

        function renderPinDots() {
            const dots = document.querySelectorAll('#pinDots .pin-dot');
            dots.forEach((d, idx) => d.classList.toggle('filled', idx < currentPinBuffer.length));
        }

        function buildKeypad() {
            const pad = document.getElementById('customKeypad');
            pad.innerHTML = '';
            const keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'key-btn';
                btn.textContent = k;
                btn.onclick = () => onKeyPress(k);
                pad.appendChild(btn);
            });
        }

        async function onKeyPress(k) {
            if (k === 'C') {
                currentPinBuffer = '';
                renderPinDots();
                return;
            }
            if (k === '⌫') {
                currentPinBuffer = currentPinBuffer.slice(0, -1);
                renderPinDots();
                return;
            }
            if (currentPinBuffer.length >= 4) return;
            currentPinBuffer += k;
            renderPinDots();

            if (currentPinBuffer.length === 4) {
                setTimeout(verifyOrCreatePin, 120);
            }
        }

        async function verifyOrCreatePin() {
            const hasPin = localStorage.getItem(STORAGE_HAS_PIN) === '1';
            if (!hasPin) {
                if (!pinSetupFirstEntry) {
                    pinSetupFirstEntry = currentPinBuffer;
                    currentPinBuffer = '';
                    renderPinDots();
                    pinPromptLabel.textContent = 'Confirm 4-Digit PIN';
                } else if (pinSetupFirstEntry === currentPinBuffer) {
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    localStorage.setItem(STORAGE_SALT_KEY, bufToB64(salt));
                    localStorage.setItem(STORAGE_HAS_PIN, '1');
                    activeCryptoKey = await deriveKeyFromPin(currentPinBuffer, salt);
                    appData = defaultAppData();
                    await saveVault();
                    unlockBookAnimation();
                } else {
                    pinSetupFirstEntry = null;
                    currentPinBuffer = '';
                    renderPinDots();
                    pinPromptLabel.textContent = 'PINs did not match. Try again';
                    pinPadContainer.classList.add('shake');
                    setTimeout(() => pinPadContainer.classList.remove('shake'), 350);
                }
            } else {
                try {
                    const salt = b64ToBuf(localStorage.getItem(STORAGE_SALT_KEY));
                    const candidateKey = await deriveKeyFromPin(currentPinBuffer, salt);
                    const cipherText = localStorage.getItem(STORAGE_VAULT_KEY);
                    const decrypted = await decryptPayload(cipherText, candidateKey);
                    activeCryptoKey = candidateKey;
                    appData = Object.assign(defaultAppData(), decrypted);
                    unlockBookAnimation();
                } catch (e) {
                    currentPinBuffer = '';
                    renderPinDots();
                    pinPromptLabel.textContent = 'Incorrect PIN';
                    pinPadContainer.classList.add('shake');
                    setTimeout(() => pinPadContainer.classList.remove('shake'), 350);
                }
            }
        }

        function unlockBookAnimation() {
            const cover = document.getElementById('bookCover');
            cover.classList.add('opening');
            setTimeout(() => {
                document.getElementById('lockScreen').classList.add('hidden');
                cover.classList.remove('opening');
                document.getElementById('appShell').classList.remove('hidden');
                navigateTo('home');
            }, 520);
        }

        document.getElementById('lockNowBtn').addEventListener('click', () => {
            activeCryptoKey = null;
            currentPinBuffer = '';
            document.getElementById('appShell').classList.add('hidden');
            pinPadContainer.classList.add('hidden');
            lockSubtitle.classList.remove('hidden');
            lockFooterHint.classList.remove('hidden');
            emblemUnlockBtn.style.pointerEvents = 'auto';
            document.getElementById('lockScreen').classList.remove('hidden');
        });

        /* =========================================================
           NAVIGATION & ROUTING
           ========================================================= */
        let currentRoute = 'home';
        let activeFolderId = null;
        let sortField = 'date';
        let sortAsc = false;
        let selectedEntryIds = new Set();

        const mainView = document.getElementById('mainView');
        const homeBtn = document.getElementById('homeBtn');
        const headerTitle = document.getElementById('headerTitle');
        const headerSubtitle = document.getElementById('headerSubtitle');

        document.getElementById('homeBtn').addEventListener('click', () => {
            if (activeFolderId) {
                activeFolderId = null;
                selectedEntryIds.clear();
                renderCurrentRoute();
            } else {
                navigateTo('home');
            }
        });

        function navigateTo(route) {
            currentRoute = route;
            activeFolderId = null;
            selectedEntryIds.clear();
            renderCurrentRoute();
        }

        function renderCurrentRoute() {
            homeBtn.classList.toggle('hidden', currentRoute === 'home');
            if (currentRoute === 'home') {
                headerTitle.textContent = 'AURORA DIARY';
                headerSubtitle.textContent = 'Page 1 • Table of Contents';
                renderHomeIndex();
            } else if (currentRoute === 'dreams' || currentRoute === 'diary') {
                const label = currentRoute === 'dreams' ? 'Dream Journal' : 'Personal Diary';
                headerTitle.textContent = label.toUpperCase();
                headerSubtitle.textContent = activeFolderId ? 'Inside Folder' : 'Folders & Entries';
                renderJournalSection(currentRoute);
            } else if (currentRoute === 'bucket') {
                headerTitle.textContent = 'BUCKET LIST';
                headerSubtitle.textContent = 'Dreams & Goals to Achieve';
                renderBucketList();
            } else if (currentRoute === 'avatar') {
                headerTitle.textContent = 'MY AVATAR';
                headerSubtitle.textContent = 'Identity, Reflections & Favorites';
                renderAvatarPage();
            }
        }

        /* =========================================================
           PAGE 1: TABLE OF CONTENTS
           ========================================================= */
        function renderHomeIndex() {
            const dreamCount = appData.dreams.entries.length;
            const diaryCount = appData.diary.entries.length;
            const bucketDone = appData.bucketList.filter(b => b.done).length;
            const bucketTotal = appData.bucketList.length;
            const nick = appData.avatar.nickname || 'Traveler';

            mainView.innerHTML = `
                <div style="margin-bottom: 1.25rem; padding: 1rem 1.25rem; border-radius: 20px; background: var(--panel-bg); border: 1px solid var(--bar-border); display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <p style="font-size: 0.72rem; color: var(--muted-fg); text-transform: uppercase; letter-spacing: 0.1em;">Welcome Back</p>
                        <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--accent-color);">${escapeHtml(nick)}</h3>
                    </div>
                    ${appData.avatar.image ? `<img src="${appData.avatar.image}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-color);">` : ''}
                </div>

                <div class="chapter-grid">
                    <button class="chapter-card" onclick="navigateTo('dreams')">
                        <div class="chapter-icon">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                        </div>
                        <div>
                            <h3 style="font-size: 1.05rem; font-weight: 700;">Dream Journal</h3>
                            <p style="font-size: 0.78rem; color: var(--muted-fg); margin-top: 2px;">${dreamCount} recorded dream${dreamCount === 1 ? '' : 's'}</p>
                        </div>
                    </button>

                    <button class="chapter-card" onclick="navigateTo('diary')">
                        <div class="chapter-icon">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                        </div>
                        <div>
                            <h3 style="font-size: 1.05rem; font-weight: 700;">Diary</h3>
                            <p style="font-size: 0.78rem; color: var(--muted-fg); margin-top: 2px;">${diaryCount} journal entr${diaryCount === 1 ? 'y' : 'ies'}</p>
                        </div>
                    </button>

                    <button class="chapter-card" onclick="navigateTo('bucket')">
                        <div class="chapter-icon">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        </div>
                        <div>
                            <h3 style="font-size: 1.05rem; font-weight: 700;">Bucket List</h3>
                            <p style="font-size: 0.78rem; color: var(--muted-fg); margin-top: 2px;">${bucketDone} of ${bucketTotal} completed</p>
                        </div>
                    </button>

                    <button class="chapter-card" onclick="navigateTo('avatar')">
                        <div class="chapter-icon">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div>
                            <h3 style="font-size: 1.05rem; font-weight: 700;">Avatar &amp; Self</h3>
                            <p style="font-size: 0.78rem; color: var(--muted-fg); margin-top: 2px;">Who I am, goals &amp; favorites</p>
                        </div>
                    </button>
                </div>
            `;
        }

        /* =========================================================
           DREAM JOURNAL & DIARY
           ========================================================= */
        const FOLDER_ICONS = {
            star: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
            moon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
            heart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
            flame: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
            compass: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
            folder: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>'
        };

        function formatDMY(isoStr) {
            const d = new Date(isoStr);
            if (isNaN(d)) return isoStr;
            const day = String(d.getDate()).padStart(2, '0');
            const mon = String(d.getMonth() + 1).padStart(2, '0');
            const yr = d.getFullYear();
            return `${day}/${mon}/${yr}`;
        }

        function renderJournalSection(sectionKey) {
            const section = appData[sectionKey];
            const currentFolder = activeFolderId ? section.folders.find(f => f.id === activeFolderId) : null;
            if (currentFolder) headerSubtitle.textContent = `Folder: ${currentFolder.name}`;

            let visibleEntries = section.entries.filter(e => (e.folderId || null) === activeFolderId);
            visibleEntries.sort((a, b) => {
                let cmp = 0;
                if (sortField === 'name') {
                    cmp = (a.title || '').localeCompare(b.title || '');
                } else {
                    cmp = new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
                }
                return sortAsc ? cmp : -cmp;
            });

            const allSelected = visibleEntries.length > 0 && visibleEntries.every(e => selectedEntryIds.has(e.id));

            let html = `
                <div class="toolbar">
                    <div style="display: flex; gap: 0.45rem; flex-wrap: wrap;">
                        <button class="btn-pill primary" onclick="openEntryModal('${sectionKey}', null)">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                            New Entry
                        </button>
                        ${!activeFolderId ? `
                        <button class="btn-pill" onclick="openFolderModal('${sectionKey}')">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
                            New Folder
                        </button>` : ''}
                    </div>

                    <div style="display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center;">
                        <button class="btn-pill" onclick="toggleSortField()">
                            Sort: ${sortField === 'date' ? 'Date' : 'Name'}
                        </button>
                        <button class="btn-pill" onclick="toggleSortDir()" title="Toggle Ascending/Descending">
                            ${sortAsc ? '↑ Up' : '↓ Down'}
                        </button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; padding: 0 0.25rem;">
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <button class="btn-pill" onclick="toggleSelectAll('${sectionKey}')">
                            ${allSelected ? 'Select None' : 'Select All'}
                        </button>
                        <span style="font-size: 0.75rem; color: var(--muted-fg);">${selectedEntryIds.size} selected</span>
                    </div>
                    ${selectedEntryIds.size > 0 ? `
                    <button class="btn-pill danger" onclick="confirmDeleteSelected('${sectionKey}')">
                        Delete (${selectedEntryIds.size})
                    </button>` : ''}
                </div>
            `;

            if (!activeFolderId && section.folders.length > 0) {
                html += `<p style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); margin-bottom: 0.5rem;">Folders</p>`;
                html += `<div class="folder-grid">`;
                section.folders.forEach(f => {
                    const count = section.entries.filter(e => e.folderId === f.id).length;
                    html += `
                        <div class="folder-card" style="border-color: ${f.color}55;">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div onclick="openFolder('${f.id}')" style="width: 36px; height: 36px; border-radius: 10px; background: ${f.color}22; color: ${f.color}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                    ${FOLDER_ICONS[f.icon] || FOLDER_ICONS.folder}
                                </div>
                                <button onclick="deleteFolderConfirm('${sectionKey}', '${f.id}')" style="font-size: 0.7rem; color: var(--muted-fg);" title="Delete Folder">✕</button>
                            </div>
                            <div onclick="openFolder('${f.id}')" style="cursor: pointer;">
                                <h4 style="font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(f.name)}</h4>
                                <p style="font-size: 0.72rem; color: var(--muted-fg);">${count} entr${count === 1 ? 'y' : 'ies'}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `<p style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); margin-bottom: 0.5rem;">
                ${activeFolderId ? 'Folder Entries' : 'Entries'}
            </p>`;

            if (visibleEntries.length === 0) {
                html += `<div style="text-align: center; padding: 2.5rem 1rem; background: var(--panel-bg); border-radius: 20px; border: 1px dashed var(--bar-border); color: var(--muted-fg); font-size: 0.85rem;">
                    No entries here yet. Tap <strong>New Entry</strong> to begin writing.
                </div>`;
            } else {
                visibleEntries.forEach(entry => {
                    const checked = selectedEntryIds.has(entry.id) ? 'checked' : '';
                    html += `
                        <div class="entry-row">
                            <div style="display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex: 1;">
                                <input type="checkbox" ${checked} onchange="toggleEntrySelect('${entry.id}', this.checked)">
                                <div onclick="openEntryModal('${sectionKey}', '${entry.id}')" style="cursor: pointer; min-width: 0; flex: 1;">
                                    <h4 style="font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(entry.title || 'Untitled')}</h4>
                                    <p style="font-size: 0.72rem; color: var(--muted-fg);">${formatDMY(entry.createdAt)} &bull; ${escapeHtml(entry.timeStr || '')}</p>
                                </div>
                            </div>
                            <div style="display: flex; gap: 0.4rem; flex-shrink: 0;">
                                <button class="btn-pill" onclick="openEntryModal('${sectionKey}', '${entry.id}')">Edit</button>
                                <button class="btn-pill" onclick="openMoveEntryModal('${sectionKey}', '${entry.id}')">Move</button>
                            </div>
                        </div>
                    `;
                });
            }

            mainView.innerHTML = html;
        }

        function openFolder(folderId) {
            activeFolderId = folderId;
            selectedEntryIds.clear();
            renderCurrentRoute();
        }
        function toggleSortField() {
            sortField = sortField === 'date' ? 'name' : 'date';
            renderCurrentRoute();
        }
        function toggleSortDir() {
            sortAsc = !sortAsc;
            renderCurrentRoute();
        }
        function toggleEntrySelect(id, isChecked) {
            if (isChecked) selectedEntryIds.add(id);
            else selectedEntryIds.delete(id);
            renderCurrentRoute();
        }
        function toggleSelectAll(sectionKey) {
            const section = appData[sectionKey];
            const visible = section.entries.filter(e => (e.folderId || null) === activeFolderId);
            const allSelected = visible.length > 0 && visible.every(e => selectedEntryIds.has(e.id));
            if (allSelected) {
                visible.forEach(e => selectedEntryIds.delete(e.id));
            } else {
                visible.forEach(e => selectedEntryIds.add(e.id));
            }
            renderCurrentRoute();
        }

        function confirmDeleteSelected(sectionKey) {
            openModal(`
                <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 0.5rem;">Delete Selected Entries?</h3>
                <p style="font-size: 0.85rem; color: var(--muted-fg); margin-bottom: 1.25rem;">
                    Are you sure you want to permanently delete ${selectedEntryIds.size} selected item(s)?
                </p>
                <div style="display: flex; justify-content: flex-end; gap: 0.6rem;">
                    <button class="btn-pill" onclick="closeModal()">Cancel</button>
                    <button class="btn-pill danger" onclick="executeDeleteSelected('${sectionKey}')">Confirm Yes</button>
                </div>
            `);
        }

        async function executeDeleteSelected(sectionKey) {
            appData[sectionKey].entries = appData[sectionKey].entries.filter(e => !selectedEntryIds.has(e.id));
            selectedEntryIds.clear();
            await saveVault();
            closeModal();
            renderCurrentRoute();
            showToast('Deleted selected entries');
        }

        /* =========================================================
           FOLDER CREATION MODAL
           ========================================================= */
        function openFolderModal(sectionKey, onCreatedCallback) {
            const colors = ['#10b981', '#3b82f6', '#a855f7', '#ef4444', '#f59e0b', '#ec4899'];
            let chosenColor = colors[0];
            let chosenIcon = 'folder';

            openModal(`
                <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 1rem;">Create Folder</h3>
                <div style="margin-bottom: 0.9rem;">
                    <label class="field-label">Folder Name</label>
                    <input id="newFolderName" type="text" class="text-input" placeholder="e.g., Lucid Dreams, Travel...">
                </div>
                <div style="margin-bottom: 0.9rem;">
                    <label class="field-label">Folder Color</label>
                    <div style="display: flex; gap: 0.6rem; align-items: center;">
                        <input id="newFolderColor" type="color" value="${chosenColor}" style="width: 44px; height: 36px; border: none; background: none; cursor: pointer;">
                        ${colors.map(c => `<button type="button" onclick="document.getElementById('newFolderColor').value='${c}'" style="width:26px;height:26px;border-radius:50%;background:${c};border:2px solid #fff3;"></button>`).join('')}
                    </div>
                </div>
                <div style="margin-bottom: 1.25rem;">
                    <label class="field-label">Folder Icon</label>
                    <div id="folderIconChoices" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        ${Object.keys(FOLDER_ICONS).map(ic => `
                            <button type="button" data-icon="${ic}" class="icon-btn folder-ic-btn" style="${ic === chosenIcon ? 'border-color: var(--accent-color); color: var(--accent-color);' : ''}">
                                ${FOLDER_ICONS[ic]}
                            </button>
                        `).join('')}
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.6rem;">
                    <button class="btn-pill" onclick="closeModal()">Cancel</button>
                    <button id="saveFolderBtn" class="btn-pill primary">Save Folder</button>
                </div>
            `);

            document.querySelectorAll('.folder-ic-btn').forEach(btn => {
                btn.onclick = () => {
                    chosenIcon = btn.dataset.icon;
                    document.querySelectorAll('.folder-ic-btn').forEach(b => {
                        b.style.borderColor = b === btn ? 'var(--accent-color)' : 'var(--bar-border)';
                        b.style.color = b === btn ? 'var(--accent-color)' : 'var(--page-fg)';
                    });
                };
            });

            document.getElementById('saveFolderBtn').onclick = async () => {
                const name = document.getElementById('newFolderName').value.trim();
                if (!name) { showToast('Please enter a folder name'); return; }
                const folder = {
                    id: 'fld_' + Date.now(),
                    name,
                    color: document.getElementById('newFolderColor').value,
                    icon: chosenIcon
                };
                appData[sectionKey].folders.push(folder);
                await saveVault();
                if (typeof onCreatedCallback === 'function') {
                    onCreatedCallback(folder.id);
                } else {
                    closeModal();
                    renderCurrentRoute();
                }
                showToast('Folder created');
            };
        }

        function deleteFolderConfirm(sectionKey, folderId) {
            openModal(`
                <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 0.5rem;">Delete Folder?</h3>
                <p style="font-size: 0.85rem; color: var(--muted-fg); margin-bottom: 1.25rem;">
                    Entries inside this folder will be moved back to the main list (not deleted).
                </p>
                <div style="display: flex; justify-content: flex-end; gap: 0.6rem;">
                    <button class="btn-pill" onclick="closeModal()">Cancel</button>
                    <button class="btn-pill danger" onclick="executeDeleteFolder('${sectionKey}', '${folderId}')">Confirm Yes</button>
                </div>
            `);
        }

        async function executeDeleteFolder(sectionKey, folderId) {
            appData[sectionKey].folders = appData[sectionKey].folders.filter(f => f.id !== folderId);
            appData[sectionKey].entries.forEach(e => { if (e.folderId === folderId) e.folderId = null; });
            await saveVault();
            closeModal();
            renderCurrentRoute();
            showToast('Folder removed');
        }

        /* =========================================================
           NEW / EDIT ENTRY MODAL
           ========================================================= */
        function openEntryModal(sectionKey, entryId) {
            const section = appData[sectionKey];
            const existing = entryId ? section.entries.find(e => e.id === entryId) : null;
            const now = new Date();
            const defaultDateIso = existing ? existing.createdAt.slice(0, 10) : now.toISOString().slice(0, 10);
            const defaultTime = existing ? existing.timeStr : now.toTimeString().slice(0, 5);
            const defaultFolder = existing ? (existing.folderId || '') : (activeFolderId || '');

            const folderOptionsHtml = () => `
                <option value="">(No Folder)</option>
                ${section.folders.map(f => `<option value="${f.id}" ${f.id === defaultFolder ? 'selected' : ''}>${escapeHtml(f.name)}</option>`).join('')}
            `;

            openModal(`
                <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 0.9rem;">
                    ${existing ? 'Edit Entry' : 'New Entry'}
                </h3>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.75rem;">
                    <div>
                        <label class="field-label">Date</label>
                        <input id="entryDateInput" type="date" class="text-input" value="${defaultDateIso}">
                    </div>
                    <div>
                        <label class="field-label">Time</label>
                        <input id="entryTimeInput" type="time" class="text-input" value="${defaultTime}">
                    </div>
                </div>

                <div style="margin-bottom: 0.75rem;">
                    <label class="field-label">Title</label>
                    <input id="entryTitleInput" type="text" class="text-input" placeholder="Entry title..." value="${existing ? escapeHtml(existing.title) : ''}">
                </div>

                <div style="margin-bottom: 0.75rem;">
                    <label class="field-label">Folder</label>
                    <div style="display: flex; gap: 0.45rem;">
                        <select id="entryFolderSelect" class="select-input" style="flex: 1;">
                            ${folderOptionsHtml()}
                        </select>
                        <button type="button" id="inlineNewFolderBtn" class="btn-pill" title="Create New Folder">+ Folder</button>
                    </div>
                </div>

                <div style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                        <label class="field-label" style="margin: 0;">Journal Content</label>
                        <span style="font-size: 0.68rem; color: var(--muted-fg);">Use keyboard mic for dictation</span>
                    </div>
                    <textarea id="entryBodyInput" class="text-area" placeholder="Write thoughts...">${existing ? escapeHtml(existing.body) : ''}</textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.6rem;">
                    <button class="btn-pill" onclick="closeModal()">Cancel</button>
                    <button id="saveEntryBtn" class="btn-pill primary">Save Entry</button>
                </div>
            `);

            document.getElementById('inlineNewFolderBtn').onclick = () => {
                const savedTitle = document.getElementById('entryTitleInput').value;
                const savedBody = document.getElementById('entryBodyInput').value;
                const savedDate = document.getElementById('entryDateInput').value;
                const savedTime = document.getElementById('entryTimeInput').value;

                openFolderModal(sectionKey, (newFolderId) => {
                    openEntryModal(sectionKey, entryId);
                    document.getElementById('entryTitleInput').value = savedTitle;
                    document.getElementById('entryBodyInput').value = savedBody;
                    document.getElementById('entryDateInput').value = savedDate;
                    document.getElementById('entryTimeInput').value = savedTime;

        async function exportEncryptedBackup() {
            if (!activeCryptoKey) return;
            const encryptedPayload = await encryptPayload(appData, activeCryptoKey);
            const backupBundle = {
                app: 'AURORA_DIARY',
                version: 1,
                salt: localStorage.getItem(STORAGE_SALT_KEY),
                vault: JSON.parse(encryptedPayload)
            };
            const blob = new Blob([JSON.stringify(backupBundle, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `AuroraDiary_EncryptedBackup_${stamp}.advault`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Encrypted backup downloaded');
        }

        function handleMergeImport(ev) {
            const file = ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const bundle = JSON.parse(reader.result);
                    if (!bundle.vault || !bundle.salt) throw new Error('Invalid backup file');

                    openModal(`
                        <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 0.5rem;">Decrypt &amp; Merge Backup</h3>
                        <p style="font-size: 0.8rem; color: var(--muted-fg); margin-bottom: 0.85rem;">
                            Enter the 4-digit PIN that was used when this backup was created:
                        </p>
                        <input id="importPinInput" type="password" inputmode="numeric" maxlength="4" class="text-input" placeholder="••••" style="text-align: center; font-size: 1.2rem; letter-spacing: 0.4em; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: flex-end; gap: 0.6rem;">
                            <button class="btn-pill" onclick="closeModal()">Cancel</button>
                            <button id="confirmDecryptMergeBtn" class="btn-pill primary">Merge Data</button>
                        </div>
                    `);

                    document.getElementById('confirmDecryptMergeBtn').onclick = async () => {
                        const pin = document.getElementById('importPinInput').value.trim();
                        try {
                            const key = await deriveKeyFromPin(pin, b64ToBuf(bundle.salt));
                            const imported = await decryptPayload(JSON.stringify(bundle.vault), key);

                            ['dreams', 'diary'].forEach(sec => {
                                const existingFolderIds = new Set(appData[sec].folders.map(f => f.id));
                                (imported[sec]?.folders || []).forEach(f => {
                                    if (!existingFolderIds.has(f.id)) appData[sec].folders.push(f);
                                });
                                const existingEntryIds = new Set(appData[sec].entries.map(e => e.id));
                                (imported[sec]?.entries || []).forEach(e => {
                                    if (!existingEntryIds.has(e.id)) appData[sec].entries.push(e);
                                });
                            });

                            const existingBucketTexts = new Set(appData.bucketList.map(b => b.text.toLowerCase()));
                            (imported.bucketList || []).forEach(b => {
                                if (!existingBucketTexts.has(b.text.toLowerCase())) {
                                    appData.bucketList.push(b);
                                }
                            });
                            if (appData.bucketList.length > 0) appData.bucketInitialized = true;

                            if (imported.avatar) {
                                Object.keys(appData.avatar).forEach(k => {
                                    if (!appData.avatar[k] && imported.avatar[k]) {
                                        appData.avatar[k] = imported.avatar[k];
                                    }
                                });
                            }

                            await saveVault();
                            closeModal();
                            renderCurrentRoute();
                            showToast('Backup decrypted & merged successfully');
                        } catch (err) {
                            showToast('Wrong PIN for this backup file');
                        }
                    };
                } catch (e) {
                    showToast('Could not read backup file');
                }
            };
            reader.readAsText(file);
        }

        /* =========================================================
           MODAL & TOAST HELPERS
           ========================================================= */
        const modalRoot = document.getElementById('modalRoot');
        function openModal(innerHtml) {
            modalRoot.innerHTML = `<div class="modal-card">${innerHtml}</div>`;
            modalRoot.classList.remove('hidden');
        }
        function closeModal() {
            modalRoot.classList.add('hidden');
            modalRoot.innerHTML = '';
        }
        modalRoot.addEventListener('click', (e) => {
            if (e.target === modalRoot) closeModal();
        });

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* =========================================================
           INITIALIZE & SERVICE WORKER REGISTRATION
           ========================================================= */
        window.addEventListener('DOMContentLoaded', () => {
            setAccentColor(localStorage.getItem('ad_accent') || '#10b981');
            setAppTheme(localStorage.getItem('ad_theme') || 'black');

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
        });
    </script>
</body>
</html>
